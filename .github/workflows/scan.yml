name: Daily Funding Scan

on:
  schedule:
    - cron: '0 16 * * *'   # 4 PM UTC every day
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write           # needed to commit updated JSON back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          # Add these as GitHub Secrets (repo → Settings → Secrets → Actions)
          # If left empty the scan still runs and updates the JSON — only the
          # email step is skipped.
          ALERT_EMAIL_FROM:     ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_TO:       ${{ secrets.ALERT_EMAIL_TO }}
        run: python run.py --now

      - name: Commit updated results
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/opportunities.json data/seen_opportunities.json
          git diff --staged --quiet \
            || git commit -m "chore: update opportunities [$(date -u +'%Y-%m-%d')]"
          git push
